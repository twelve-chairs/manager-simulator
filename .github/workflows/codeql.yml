# Scans the TypeScript with CodeQL on pushes and pull requests to main, and weekly so new queries reach unchanged code.
# Findings appear on the repository's Security tab. Actions are pinned to commit SHAs (tags noted beside them), and the
# job gets only the permission it needs to upload results.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          # TypeScript needs no build for analysis.
          build-mode: none
          # The default queries plus the extended security set.
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
