# Typechecks, lints, tests (unit and end-to-end) and builds the game on every push and pull request to main, and on a push
# to main only publishes it to www.manager-simulator.io (S3 and CloudFront, infra/site.yml). GitHub Pages, the game's
# old address, serves only a page sending visitors there (UI-HOST-007).
# Actions are pinned to commit SHAs (tags noted beside them), and each job gets only the permissions it needs.
name: Deploy to AWS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests check in their own group, so they never queue behind or hold up a deploy.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so the build it deploys is stamped with a real version (UI-BUILD-004).
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      # No installed package needs a lifecycle script on Linux (fsevents, the only one with one, is macOS-only), so none
      # is allowed to run.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The end-to-end tests build the game themselves and play it in Chromium under its Content-Security-Policy.
      # Through the locked Playwright in node_modules: npx could fetch and run an unpinned package.
      - run: npm run playwright:install
      - run: npm run test:e2e
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: redirect

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The game's own address: built for the domain's root and uploaded to the site's bucket as a role trusted only for
  # this repository's main branch (UI-HOST-006). The role, bucket and distribution come from secrets, so no account
  # details are in the repository.
  site:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      # Hashed assets are cached for a year; the icons, preview, robots and sitemap, which keep their names, for an hour;
      # the page is never cached, so a deploy reaches players at once.
      - run: |
          aws s3 sync dist/assets "s3://$SITE_BUCKET/assets" --delete --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://$SITE_BUCKET" --delete --exclude index.html --exclude "assets/*" --cache-control "public, max-age=3600"
          aws s3 cp dist/index.html "s3://$SITE_BUCKET/index.html" --cache-control "no-cache" --content-type "text/html; charset=utf-8"
          aws cloudfront create-invalidation --distribution-id "$SITE_DISTRIBUTION_ID" --paths "/*"
        env:
          SITE_BUCKET: ${{ secrets.SITE_BUCKET }}
          SITE_DISTRIBUTION_ID: ${{ secrets.SITE_DISTRIBUTION_ID }}
