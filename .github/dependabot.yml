# Weekly update pull requests for the npm dev tools and for the GitHub Actions the workflows pin by SHA.
# Every update waits a week after release before it is proposed, so a compromised release has time to be caught, and
# every pull request runs the same checks as a push before it can be merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-tools:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
