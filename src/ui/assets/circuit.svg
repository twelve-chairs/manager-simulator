<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- One tile of a circuit board: traces that leave one edge re-enter the opposite edge at the same offset, so tiles join seamlessly. -->
  <g fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Traces crossing the tile left to right -->
    <path d="M0 30 H50 L70 50 H130 L150 30 H240"/>
    <path d="M0 150 H40 L60 130 H96"/>
    <path d="M144 130 H180 L200 150 H240"/>
    <path d="M0 210 H110 L125 195 H170"/>
    <!-- Traces crossing the tile top to bottom -->
    <path d="M30 0 V70 L45 85 V110"/>
    <path d="M210 0 V60 L190 80 V100"/>
    <path d="M90 240 V200 L105 185 V158"/>
    <path d="M200 240 V215 L185 200 V175"/>
    <path d="M30 240 V182"/>
    <!-- The chip's pins -->
    <path d="M104 112 V120 M112 112 V120 M120 112 V120 M128 112 V120 M136 112 V120"/>
    <path d="M104 152 V160 M112 152 V160 M120 152 V160 M128 152 V160 M136 152 V160"/>
    <!-- Short traces from the pins -->
    <path d="M112 112 V96 L100 84 M128 112 V90 L140 78 H170"/>
    <path d="M112 160 V175 M136 160 V170 L150 184"/>
    <!-- A small resistor -->
    <path d="M150 110 H160 M180 110 H190"/>
  </g>
  <!-- The chip -->
  <rect x="96" y="120" width="48" height="32" rx="3" fill="none" stroke="#000" stroke-width="2"/>
  <rect x="160" y="104" width="20" height="12" rx="2" fill="none" stroke="#000" stroke-width="2"/>
  <!-- Pads: rings where traces end -->
  <g fill="none" stroke="#000" stroke-width="2">
    <circle cx="45" cy="114" r="4"/>
    <circle cx="190" cy="104" r="4"/>
    <circle cx="100" cy="84" r="4"/>
    <circle cx="174" cy="210" r="4"/>
    <circle cx="112" cy="179" r="4"/>
    <circle cx="153" cy="187" r="4"/>
    <circle cx="174" cy="78" r="4"/>
    <circle cx="146" cy="110" r="4"/>
    <circle cx="30" cy="178" r="4"/>
    <circle cx="185" cy="171" r="4"/>
  </g>
  <!-- Vias: small filled dots -->
  <g fill="#000">
    <circle cx="70" cy="50" r="2.5"/>
    <circle cx="150" cy="30" r="2.5"/>
    <circle cx="60" cy="130" r="2.5"/>
    <circle cx="200" cy="150" r="2.5"/>
    <circle cx="125" cy="195" r="2.5"/>
    <circle cx="190" cy="80" r="2.5"/>
    <circle cx="215" cy="190" r="2.5"/>
    <circle cx="60" cy="195" r="2.5"/>
    <circle cx="165" cy="55" r="2.5"/>
  </g>
</svg>
